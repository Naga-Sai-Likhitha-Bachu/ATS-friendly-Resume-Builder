<!DOCTYPE html>
<html>
<head>
    <title>ATS-Friendly AI Resume Builder</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f6f8;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 70%;
            margin: auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #222;
        }

        h2 {
            color: #333;
            border-bottom: 1px solid #ddd;
            padding-bottom: 5px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 15px;
        }

        input, textarea {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        textarea {
            height: 100px;
            resize: vertical;
        }

        button {
            margin-top: 25px;
            width: 100%;
            padding: 12px;
            background-color: #222;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #444;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>ATS-Friendly AI Resume Builder</h1>

    <p>Create a professional, ATS-friendly resume.</p>

    <form method="POST">

        <h2>Personal Details</h2>

        <label>Full Name</label>
        <input type="text" name="name" placeholder="Enter your full name">

        <label>Email</label>
        <input type="email" name="email" placeholder="Enter your email">

        <label>Phone Number</label>
        <input type="text" name="phone" placeholder="Enter your phone number">

        <label>LinkedIn Profile</label>
        <input type="text" name="linkedin" placeholder="LinkedIn profile">

        <label>GitHub Profile</label>
        <input type="text" name="github" placeholder="GitHub profile">


        <h2>Education</h2>

        <textarea name="education"
                  placeholder="Enter your education details"></textarea>


        <h2>Skills</h2>

        <textarea name="skills"
                  placeholder="Example: Python, C, Machine Learning, Flask"></textarea>


        <h2>Experience</h2>

        <textarea name="experience"
                  placeholder="Enter your internship or work experience"></textarea>


        <h2>Projects</h2>

        <textarea name="projects"
                  placeholder="Enter your projects"></textarea>


        <h2>Certifications</h2>

        <textarea name="certifications"
                  placeholder="Enter your certifications"></textarea>


        <h2>Achievements</h2>

        <textarea name="achievements"
                  placeholder="Enter your achievements"></textarea>


        <button type="submit">Generate Resume</button>

    </form>

</div>

</body>
</html>
